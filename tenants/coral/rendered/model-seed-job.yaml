# ===========================================================================
# STUDIO FRAGMENT — MODEL SEED JOB
# Rendered by studio/backend into tenants/$project/rendered/model-seed-job.yaml
# ===========================================================================
# Downloads the chosen model from the curated catalogue into the project's own
# `models` PVC, so the InferenceService serves it from `pvc://models[/subpath]`
# rather than reaching out to the internet on every cold start. That is the access
# pattern production actually uses — models come from WekaFS there, not a public
# bucket — so rehearsing it locally is the point.
#
# This is also the ONLY network egress the provisioning pipeline performs, and its
# URL can only ever be a `seedUrl` from templates/catalog/models.yaml. A PI cannot
# supply one. That closure is the governance boundary described in ADR-11's
# menu-not-kitchen framing, and this Job is where it is cashed in.
#
# ORDERING: this Job is applied after namespace-pack and before the vCluster. It
# carries NO resource stanza, so it is admissible only because namespace-pack's
# LimitRange defaults cpu/memory for it — the first live proof in every deployment
# that the LimitRange is mandatory rather than tidy.
#
# ---------------------------------------------------------------------------
# TEMPLATING CONTRACT
# ---------------------------------------------------------------------------
# Two passes: `#@if <key>=<value>` / `#@end` conditional blocks first (this file has
# none), then string.Template substitution. A LITERAL dollar sign must be written
# `$`. THE EMBEDDED PYTHON BELOW DELIBERATELY CONTAINS NO `$` — no f-string with a
# shell variable, no string.Template of its own. Introducing one silently breaks
# rendering, and the error surfaces as a KeyError in the pipeline rather than as
# anything to do with this file.
#
# Placeholders used here:
#   $project          project name
#   $model_seed_url   the chosen model's `seedUrl`, verbatim from models.yaml
#   $model_subpath    the chosen model's `storageSubpath`; "" means the claim ROOT
#
# `$model_subpath` may be EMPTY, and the script below is written to handle that
# without producing a doubled slash — see the normpath call.
#
# python:3.11-slim publishes linux/arm64, so this runs natively on Apple Silicon
# (CLAUDE.md working agreements). The download uses ONLY the standard library, so
# the Job needs no package index and cannot be broken by one being unavailable.
# ===========================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-coral
  namespace: p-coral
  labels:
    hive.ksl/project: coral
    hive.ksl/role: seed
    hive.ksl/template: studio-inference
spec:
  # A network download; transient failure is normal and worth retrying.
  backoffLimit: 3
  template:
    metadata:
      labels:
        hive.ksl/project: coral
        hive.ksl/role: seed
    spec:
      # `Never` replaces a failed pod with a new one (counted against backoffLimit)
      # rather than restarting it in place, which keeps the failure visible in
      # `kubectl get pods` instead of hiding it in a restart count. The Studio
      # provisioning UI reads that, so the failure must stay visible.
      restartPolicy: Never
      containers:
        - name: seed
          image: python:3.11-slim
          volumeMounts:
            # Mounted READ-WRITE. This is the only workload that may ever write to
            # `models`; the serving pod gets it read-only.
            - name: models
              mountPath: /mnt/models
          command:
            - python3
            - -c
            - |
              import os, sys, urllib.request, urllib.parse

              URL     = "https://storage.googleapis.com/kfserving-examples/models/sklearn/1.0/model/model.joblib"
              SUBPATH = ""

              # normpath collapses "/mnt/models/" + "" into "/mnt/models" rather than
              # leaving "/mnt/models//". Harmless on POSIX, but the same join is what
              # produces the storageUri the InferenceService mounts, and there a
              # trailing slash is NOT the proven-working form. Keeping the two
              # consistent is the point.
              dest_dir = os.path.normpath(os.path.join("/mnt/models", SUBPATH))

              # Filename comes from the URL, so the artefact on disk keeps the name
              # the runtime expects: model.joblib for sklearn (whose server globs the
              # directory for exactly one .joblib/.pkl/.pickle), *.gguf for llama.cpp.
              filename = os.path.basename(urllib.parse.urlparse(URL).path)
              if not filename:
                  print("ERROR: could not derive a filename from " + URL, file=sys.stderr)
                  sys.exit(1)
              dst = os.path.join(dest_dir, filename)

              os.makedirs(dest_dir, exist_ok=True)

              # IDEMPOTENT. Re-running this Job must never corrupt a good artefact —
              # and it WILL be re-run: a retried deployment, a re-applied fragment,
              # or a backoffLimit retry after a later step failed all land here again.
              if os.path.exists(dst) and os.path.getsize(dst) > 0:
                  print("already seeded: " + dst + " (" + str(os.path.getsize(dst)) + " bytes) - nothing to do")
                  sys.exit(0)

              print("downloading " + URL)
              print("       into " + dst)

              # Download to a temporary name and rename into place. An interrupted
              # download must never leave a truncated file that the idempotency check
              # above would then mistake for a complete one.
              tmp = dst + ".part"
              with urllib.request.urlopen(URL, timeout=600) as response:
                  if response.status != 200:
                      print("ERROR: unexpected HTTP status " + str(response.status), file=sys.stderr)
                      sys.exit(1)
                  # Streamed in chunks rather than read() in one go: model weights can
                  # be far larger than the container's memory limit.
                  with open(tmp, "wb") as out:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          out.write(chunk)

              size = os.path.getsize(tmp)
              if size == 0:
                  print("ERROR: downloaded 0 bytes", file=sys.stderr)
                  sys.exit(1)

              os.rename(tmp, dst)
              print("seeded " + dst + " (" + str(size) + " bytes)")
              print("contents of " + dest_dir + ": " + str(os.listdir(dest_dir)))
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
