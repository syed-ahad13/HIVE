apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: demo-cv-x-default-x-demo-cv
  namespace: p-demo-cv
  labels:
    hive.ksl/project: demo-cv
    hive.ksl/template: studio-inference
    hive.ksl/managed-by: studio-executor
    hive.ksl/virtual-name: demo-cv
  annotations:
    serving.kserve.io/deploymentMode: Serverless
    autoscaling.knative.dev/min-scale: '0'
    autoscaling.knative.dev/window: 60s
    autoscaling.knative.dev/scale-down-delay: 60s
spec:
  predictor:
    minReplicas: 0
    model:
      modelFormat:
        name: sklearn
      storageUri: pvc://models
      resources:
        limits:
          nvidia.com/gpu: '1'
