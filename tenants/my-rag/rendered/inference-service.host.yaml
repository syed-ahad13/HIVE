apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: my-rag-x-default-x-my-rag
  namespace: p-my-rag
  labels:
    hive.ksl/project: my-rag
    hive.ksl/template: studio-rag
    hive.ksl/role: chat-model
    hive.ksl/managed-by: studio-executor
    hive.ksl/virtual-name: my-rag
  annotations:
    serving.kserve.io/deploymentMode: Serverless
    autoscaling.knative.dev/min-scale: '1'
spec:
  predictor:
    minReplicas: 1
    model:
      modelFormat:
        name: gguf
      runtime: hive-llama-cpp-rag
      storageUri: pvc://models/llm
      resources:
        limits:
          nvidia.com/gpu: '1'
