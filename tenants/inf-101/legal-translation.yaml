# ===========================================================================
# ARCHETYPE T-AO — PI A (tenant Inf-101), ALWAYS-ON
# ===========================================================================
# This is the always-on archetype. `autoscaling.knative.dev/min-scale: "1"` is the
# EXPLICIT always-on override: it tells the Knative autoscaler never to scale this
# Revision below one replica, so the service never scales to zero and never pays a
# cold start. A researcher hitting it gets a warm response at any hour.
#
# The cost of that guarantee is that the GPU is held permanently — 1 of the tenant's
# 1-GPU Medium ceiling, whether or not anyone is using it. That is the deliberate
# trade of the archetype, and it is exactly what makes T-AO different from T-SZ.
#
# THE MODEL IS A STAND-IN. PI A's real workload is a 70B-parameter LLM. This serves a
# ~5KB scikit-learn iris classifier instead. That substitution is intentional:
# **archetype behaviour is the deliverable, not model realism.** What must be proven
# here is that an always-on service, authored by a tenant inside their own control
# plane, holds a GPU and stays warm — not that a 70B model fits on a MacBook. The
# InferenceService shape, the GPU request surface, and the autoscaling annotations are
# all byte-identical to what the real model will use.
#
# ---------------------------------------------------------------------------
# WHERE THIS IS APPLIED, AND WHERE IT RUNS
# ---------------------------------------------------------------------------
# AUTHORED inside the tenant's own vCluster:
#   vcluster connect inf-101 -n p-inf-101 -- kubectl apply -f - < this file
#
# RECONCILED on the host by the ONE central KServe (§2.2), against a mirrored copy in
# host namespace p-inf-101 named `legal-translation-x-default-x-inf-101`.
#
# ---------------------------------------------------------------------------
# WHY storageUri IS `pvc://models` AND NOT `pvc://models/model.joblib`
# ---------------------------------------------------------------------------
# `pvc://` is handled differently from `gs://` or `s3://`. There is NO
# storage-initializer download: KServe mounts the PVC directly at /mnt/models, and any
# path after the claim name becomes a **subPath**. From KServe v0.20's
# storage_initializer_injector.go:
#
#     // Pvc will be mount to /mnt/models rather than /mnt/pvc.
#     // PvcPath will be injected via SubPath, pvcPath must be a root or Dir.
#     // It is user responsibility to ensure it is a root or Dir
#
# And the sklearn server treats /mnt/models as a DIRECTORY, globbing it for exactly
# one file ending in .joblib/.pkl/.pickle (sklearnserver/model.py).
#
# So `pvc://models/model.joblib` would mount a FILE at the directory path /mnt/models
# and fail. `pvc://models` leaves the subPath empty (ParsePvcURI returns pvcPath="")
# and mounts the claim ROOT — which contains exactly `model.joblib`, seeded in step 5.
#
# The claim is resolved in the namespace the POD runs in, i.e. the HOST namespace
# p-inf-101 after sync. There is deliberately no `models` PVC inside the vCluster;
# there does not need to be, because the pod never runs there.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: legal-translation
  namespace: default
  labels:
    hive.ksl/project: inf-101
    hive.ksl/template: t-ao
    hive.ksl/gate: g3-archetype
  annotations:
    # Per-service assertion of the cluster-wide default (§2.2). Explicit here so the
    # archetype cannot silently degrade to Standard/RawDeployment if the cluster
    # default were ever lost — KServe's compiled-in fallback is Standard.
    serving.kserve.io/deploymentMode: "Serverless"
    # THE always-on override. Never fewer than one replica.
    autoscaling.knative.dev/min-scale: "1"
spec:
  predictor:
    # Stated explicitly rather than relying on a default. KServe derives the Knative
    # `min-scale` annotation from THIS field and overwrites the isvc annotation above.
    # For T-AO the two happen to agree — KServe's default for `minReplicas` is also 1 —
    # so the annotation alone would appear to work here purely by coincidence. It does
    # NOT work for T-SZ (see tenants/inf-103/species-classifier.yaml, where min-scale 0
    # was silently clobbered to 1). Writing it out means the always-on guarantee rests
    # on a declared value, not on an upstream default that could change.
    minReplicas: 1
    model:
      modelFormat:
        name: sklearn
      # Claim root mounted at /mnt/models — see the header.
      storageUri: "pvc://models"
      resources:
        limits:
          # The ONE GPU request surface (§2.3). Identical locally and in production;
          # locally satisfied by the fake extended resource from step 2.
          nvidia.com/gpu: "1"
